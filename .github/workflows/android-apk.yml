name: AXIOM Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reuse test signing key across future builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: axiom-experimental-debug-signing-v02
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AXIOM-AI-Android-v0.3
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: axiom-android-v0.3
          name: AXIOM AI Android v0.3 (experimental)
          prerelease: true
          make_latest: false
          body: |
            APK de testes com IA local Qwen2.5 0.5B.
            Anexos OCR/imagens/PDF, ditado, pesquisa Wikipédia, plugins, modo alto e Qwen 1.5B opcional.\n            O modelo GGUF (~398 MB) é baixado na primeira instalação.
            A versão é experimental; ainda não foi testada em aparelho físico.
          files: app/build/outputs/apk/debug/app-debug.apk
